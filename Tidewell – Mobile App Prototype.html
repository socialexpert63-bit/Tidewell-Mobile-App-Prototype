<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#EEF3F5;--card:#fff;--ink:#0F1B2D;--mut:#6A7787;--line:#E1E8ED;--brand:#12B5A6;--brand2:#0A7F8F;--sun:#FF6B4A;--red:#E5484D;--shadow:0 8px 24px rgba(15,27,45,.08);--stage:#DCE6EA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1420;--card:#142234;--ink:#EAF1F6;--mut:#8FA0B2;--line:#223348;--shadow:0 8px 24px rgba(0,0,0,.35);--stage:#060C14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1420;--card:#142234;--ink:#EAF1F6;--mut:#8FA0B2;--line:#223348;--shadow:0 8px 24px rgba(0,0,0,.35);--stage:#060C14;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--stage);font-family:Figtree,system-ui,sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
h1,h2,h3,.d{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em}
#phone{width:100%;max-width:390px;height:min(820px,calc(100vh - 32px));background:var(--bg);border-radius:38px;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.28),0 0 0 8px #0F1B2D;display:flex;flex-direction:column}
@media(max-width:430px){body{padding:0}#phone{max-width:none;height:100vh;border-radius:0;box-shadow:none}}
#scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}#scr::-webkit-scrollbar{display:none}
.pg{padding:22px 20px 28px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:up .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes sh{to{background-position:-200% 0}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:16px;font:600 16px Figtree,sans-serif;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));cursor:pointer;transition:transform .12s,box-shadow .2s;box-shadow:0 10px 22px rgba(18,181,166,.32)}
.btn:active{transform:scale(.97)}.btn.sec{background:var(--card);color:var(--ink);box-shadow:none;border:1px solid var(--line)}.btn.dng{background:var(--red);box-shadow:none}
.btn:focus-visible,.pr:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.pr{cursor:pointer;transition:transform .12s}.pr:active{transform:scale(.97)}
.mut{color:var(--mut);font-size:13px}.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--card);box-shadow:var(--shadow);border:0;cursor:pointer;color:var(--ink)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 16px 'Bricolage Grotesque';color:#fff;background:linear-gradient(135deg,#FFB020,#E5484D);flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px;margin:0 -20px;scrollbar-width:none}.chip{flex:none;padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);font:500 14px Figtree;color:var(--ink);cursor:pointer;transition:.2s}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.inp{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 16px Figtree;transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(18,181,166,.18)}.inp.bad{border-color:var(--red)}
.err{color:var(--red);font-size:13px;margin-top:6px;min-height:0}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 8px 10px}
.tab{flex:1;border:0;background:none;color:var(--mut);font:500 11px Figtree;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;padding:6px 0}
.tab span{font-size:22px;transition:transform .25s}.tab.on{color:var(--brand2)}.tab.on span{transform:translateY(-3px) scale(1.12)}
.dot{position:absolute;top:2px;right:28%;width:9px;height:9px;background:var(--red);border-radius:50%}
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px}
.tog{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;border:0;cursor:pointer;transition:.25s;flex:none}.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 4px rgba(0,0,0,.25)}.tog.on{background:var(--brand)}.tog.on::after{left:23px}
#toast{position:absolute;left:20px;right:20px;top:18px;z-index:30;background:var(--ink);color:var(--bg);padding:13px 16px;border-radius:14px;font-weight:500;transform:translateY(-90px);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}#toast.show{transform:none}
#sheet{position:absolute;inset:0;z-index:20;background:rgba(5,10,18,.5);opacity:0;pointer-events:none;transition:opacity .25s}#sheet.show{opacity:1;pointer-events:auto}
#sheet>div{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:28px 28px 0 0;padding:22px 20px 30px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}#sheet.show>div{transform:none}
.dim{opacity:.5}.map{height:330px;border-radius:22px;position:relative;overflow:hidden;background:#CFE8E4}
.pin{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:#fff;font:600 12px Figtree;padding:6px 10px;border-radius:99px;cursor:pointer;transition:.2s;border:2px solid #fff}.pin.on{background:var(--brand2);transform:translate(-50%,-100%) scale(1.15);z-index:2}
.fl{position:absolute;border-radius:50%;animation:float 7s ease-in-out infinite;opacity:.35}
.chip svg{vertical-align:-3px}.eic{width:84px;height:84px;border-radius:28px;background:rgba(18,181,166,.14);color:var(--brand2);display:grid;place-items:center;margin:0 auto}.ic svg{display:block}
.tag{font:600 11px Figtree;background:rgba(18,181,166,.14);color:var(--brand2);padding:4px 9px;border-radius:99px}
@keyframes wv{to{transform:translateX(-50%)}}@keyframes pls{0%{box-shadow:0 0 0 0 rgba(255,107,74,.6)}100%{box-shadow:0 0 0 9px transparent}}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sun);animation:pls 1.4s infinite;margin-right:6px}
.wave{position:absolute;left:0;bottom:0;width:200%;height:46px;animation:wv 6s linear infinite}
.ring{width:96px;height:96px;border-radius:50%;position:relative;overflow:hidden;border:3px solid var(--brand);background:var(--card);flex:none}.ring .lv{position:absolute;left:0;bottom:0;width:100%;height:0;background:linear-gradient(180deg,#2BD4C1,var(--brand2));transition:height 1.2s cubic-bezier(.2,.8,.2,1)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 26px 'Bricolage Grotesque';color:var(--ink);z-index:1;text-shadow:0 0 8px var(--card)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style></head><body>
<div id="phone"><div id="scr"></div><div id="tabs"></div><div id="sheet"><div id="sb"></div></div><div id="toast"></div></div>

{id:1,n:'Maya Chen',s:'Deep home cleaning',c:'Cleaning',p:48,r:4.9,rv:212,d:.8,e:'🧼',g:'#12B5A6,#0A7F8F',x:30,y:38,b:'Eco-certified cleaner with eight years in apartments and family homes. Brings her own supplies.'},

{id:3,n:'Spark Electric',s:'Wiring & fittings',c:'Electric',p:72,r:4.9,rv:301,d:2.1,e:'💡',g:'#FFB020,#E57A00',x:48,y:62,b:'Certified electricians for rewiring, fans, lighting and safety checks.'},

login:()=>`<div class="pg"><h1 style="font-size:32px;margin-top:30px">Welcome back</h1><p class="mut" style="margin:6px 0 26px">Sign in to book and track your services.</p><label class="mut">Email</label><input class="inp" id="em" type="email" value="${S.email}" placeholder="you@example.com" style="margin:6px 0"><div class="err" id="ee"></div><label class="mut" style="display:block;margin-top:12px">Password</label><div style="position:relative"><input class="inp" id="pw" type="${S.pw?'text':'password'}" value="${S.pass}" placeholder="At least 8 characters" style="margin:6px 0"><button data-a="pw" style="position:absolute;right:12px;top:16px;border:0;background:none;font-size:18px;cursor:pointer" aria-label="Show password">${I(S.pw?'eyeoff':'eye',20)}</button></div><div class="err" id="pe"></div><div style="height:6px;border-radius:9px;background:var(--line);margin:8px 0 4px;overflow:hidden"><div id="st" style="height:100%;width:0;background:var(--red);transition:.3s"></div></div><p class="mut" id="sl">Password strength</p><button class="btn" style="margin-top:20px" data-a="login">${S.busy?'<i style="width:18px;height:18px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></i> Signing in':'Sign in'}</button><p class="mut" style="text-align:center;margin:18px 0">or continue with</p><div class="row"><button class="btn sec" data-a="demo"> Apple</button><button class="btn sec" data-a="demo"><b style="color:#4285F4">G</b> Google</button></div><p class="mut" style="text-align:center;margin-top:20px">Demo only: any valid email and 8+ character password works.</p></div>`,
home:()=>`<div class="pg"><div class="row sp rise"><div class="row"><div class="av">N</div><div><div class="mut">Good morning</div><h2 style="font-size:22px">Nicholas</h2></div></div><button class="ic" data-a="tab" data-t="alerts" aria-label="Notifications">${I('bell')}</button></div>
<div class="rise" style="--i:1;margin:20px 0;border-radius:26px;padding:22px 22px 52px;color:#fff;background:linear-gradient(135deg,#0F1B2D,#0A7F8F);position:relative;overflow:hidden"><div class="fl" style="width:140px;height:140px;background:var(--sun);right:-40px;top:-40px"></div><h2 style="font-size:25px;line-height:1.15;max-width:200px">Your kitchen tap is dripping. Fix it today.</h2><p style="opacity:.9;margin:10px 0 16px;font-size:14px"><i class="live"></i>3 plumbers can arrive within 25 min</p><button class="chip" style="color:var(--ink);font-weight:600;position:relative;z-index:1" data-a="cat" data-c="Plumbing">Find a plumber</button><svg class="wave" viewBox="0 0 800 46" preserveAspectRatio="none"><path d="M0 20 Q100 0 200 20 T400 20 T600 20 T800 20 V46 H0Z" fill="rgba(18,181,166,.4)"/></svg></div>
<div class="row rise" style="--i:2;gap:10px">${[['Bookings',S.bk.length+3],['Saved',S.fav.size],['Hours saved',12]].map(x=>`<div class="card" style="flex:1;padding:14px;text-align:center"><div class="d" style="font-size:26px;font-weight:800" data-n="${x[1]}">0</div><div class="mut">${x[0]}</div></div>`).join('')}</div>
<h3 style="margin:24px 0 12px" class="rise" style="--i:3">Categories</h3><div class="chips rise" style="--i:3">${CATS.slice(1).map(c=>`<button class="chip" data-a="cat" data-c="${c}">${I(CI[c],16)} ${c}</button>`).join('')}</div>
<div class="row sp" style="margin:24px 0 12px"><h3>Recommended nearby</h3><button class="chip" data-a="tab" data-t="explore">See all</button></div><div style="display:grid;gap:14px">${P.slice(0,3).map((p,i)=>card(p,i+4)).join('')}</div></div>`,
explore:()=>`<div class="pg"><h2 style="font-size:28px" class="rise">Explore</h2><div class="row" style="margin:14px 0"><input class="inp" id="q" value="${S.q}" placeholder="Search plumbers, cleaning…"><button class="ic" data-a="sheet" aria-label="Sort" style="flex:none">${I('sliders')}</button></div><div class="chips">${CATS.map(c=>`<button class="chip ${S.cat==c?'on':''}" data-a="cat" data-c="${c}">${c}</button>`).join('')}</div><div class="row sp" style="margin:14px 0"><span class="mut">Sorted by ${S.sort}</span><div class="row" style="gap:6px"><button class="chip ${S.view=='list'?'on':''}" data-a="view" data-v="list">List</button><button class="chip ${S.view=='map'?'on':''}" data-a="view" data-v="map">Map</button></div></div><div id="res">${results()}</div></div>`,
detail:()=>{const p=P.find(x=>x.id==S.sel);return `<div style="animation:in .35s both"><div style="height:260px;position:relative">${ill(p)}<button class="ic" data-a="back" style="position:absolute;left:16px;top:18px" aria-label="Back">${I('back')}</button><button class="ic" data-a="fav" data-id="${p.id}" style="position:absolute;right:16px;top:18px" aria-label="Save">${HR(p.id)}</button></div><div style="margin-top:-24px;background:var(--bg);border-radius:28px 28px 0 0;padding:24px 20px 30px;position:relative"><div class="row sp"><h1 style="font-size:28px">${p.n}</h1><b>$${p.p}/hr</b></div><p class="mut" style="margin:4px 0 14px">${I('star',14,'#FFB020','#FFB020')} ${p.r} (${p.rv} reviews) · ${p.d} km away</p><div class="card row" style="padding:14px;margin:16px 0;gap:16px"><div class="ring"><div class="lv" id="lv" data-h="${Math.round(p.r*20)}"></div><b>${Math.round(p.r*20)}</b></div><div><b class="d" style="font-size:18px">Tide score</b><div class="mut">Built from on-time arrivals, repeat bookings and fixed-first-visit rate.</div></div></div><p>${p.b}</p><h3 style="margin:22px 0 10px">Pick a time</h3><div class="chips">${SL.map((s,i)=>`<button class="chip ${S.slot==i?'on':''}" data-a="slot" data-i="${i}">${s}</button>`).join('')}</div><button class="btn" style="margin-top:26px" data-a="checkout">Book for 2 hours</button></div></div>`},
checkout:()=>{const p=P.find(x=>x.id==S.sel),t=price();return `<div class="pg"><div class="row"><button class="ic" data-a="back" aria-label="Back">${I('back')}</button><h2>Checkout</h2></div><div class="card rise" style="padding:16px;margin:20px 0"><div class="row"><div style="width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none">${ill(p)}</div><div><b>${p.n}</b><div class="mut">${SL[S.slot]} · 2 hours</div></div></div></div><h3 style="margin-bottom:10px">Pay with</h3>${[['card','card','Visa •••• 4242'],['apple','apple','Apple Pay']].map(m=>`<div class="card pr row" data-a="pay" data-m="${m[0]}" style="padding:14px;margin-bottom:10px;border:2px solid ${S.pay==m[0]?'var(--brand)':'transparent'}"><span>${I(m[1],26)}</span><b style="flex:1">${m[2]}</b><span>${S.pay==m[0]?I('check',22,'var(--brand2)'):'<i style="width:20px;height:20px;border:2px solid var(--line);border-radius:50%;display:inline-block"></i>'}</span></div>`).join('')}<div class="row" style="margin:14px 0"><input class="inp" id="pc" placeholder="Promo code (try HELLO10)"><button class="chip" data-a="promo">Apply</button></div><div class="card" style="padding:16px"><div class="row sp"><span class="mut">Service (2 h)</span><span>$${t.sub.toFixed(2)}</span></div><div class="row sp" style="margin-top:8px"><span class="mut">Service fee</span><span>$${t.fee.toFixed(2)}</span></div>${t.off?`<div class="row sp" style="margin-top:8px;color:var(--brand2)"><span>Promo HELLO10</span><span>−$${t.off.toFixed(2)}</span></div>`:''}<div class="row sp d" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:20px;font-weight:800"><span>Total</span><span>$${t.tot}</span></div></div><button class="btn" style="margin-top:18px" data-a="paynow">Pay $${t.tot}</button><p class="mut" style="text-align:center;margin-top:12px">🔒 Encrypted. Mock payment, no real charge.</p><p style="text-align:center;margin-top:8px"><button data-a="decline" style="border:0;background:none;color:var(--mut);text-decoration:underline;cursor:pointer;font:13px Figtree">Simulate a declined card</button></p></div>`},
proc:()=>`<div style="min-height:760px;display:grid;place-items:center;text-align:center"><div><i style="display:block;margin:0 auto 18px;width:54px;height:54px;border:5px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite"></i><h2>Processing payment</h2><p class="mut">Please keep the app open.</p></div></div>`,
track:()=>{const p=P.find(x=>x.id==S.sel);return `<div style="animation:in .35s both;min-height:760px"><div class="map" style="height:440px;border-radius:0"><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><path d="M0 40 Q30 30 55 45 T100 38" stroke="#fff" stroke-width="3" fill="none"/><path d="M40 0 Q45 40 38 100" stroke="#fff" stroke-width="3" fill="none"/><path id="rt" d="M82 14 C70 30 60 22 52 44 S40 70 30 82" stroke="#0A7F8F" stroke-width="2" fill="none" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/></svg><div id="mv" class="pin on" style="left:82%;top:14%;transition:none;">${I(CI[p.c],18,'#fff')}</div><div class="pin" style="left:30%;top:82%;background:var(--sun)">Your home</div><button class="ic" data-a="tab" data-t="bookings" style="position:absolute;left:16px;top:18px" aria-label="Back">${I('back')}</button></div><div style="margin-top:-26px;background:var(--bg);border-radius:28px 28px 0 0;padding:24px 20px;position:relative"><h1 style="font-size:30px"><i class="live"></i>Arriving in <span id="eta">12</span> min</h1><div style="height:8px;border-radius:9px;background:var(--line);margin:14px 0 18px;overflow:hidden"><div id="bar" style="height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2))"></div></div><div class="card row" style="padding:14px"><div class="av" style="background:linear-gradient(135deg,${p.g})">${p.n[0]}</div><div style="flex:1"><b>${p.n}</b><div class="mut">${p.s}</div></div><button class="ic" data-a="toast" data-m="Calling ${p.n} (mock)" aria-label="Call">${I('phone',20)}</button><button class="ic" data-a="toast" data-m="Chat opened (mock)" aria-label="Message">${I('chat',20)}</button></div></div></div>`},
ok:()=>{const p=P.find(x=>x.id==S.sel);return `<div class="pg" style="min-height:760px;display:grid;place-items:center;text-align:center"><div><svg width="110" height="110" viewBox="0 0 52 52" style="animation:pop .5s both"><circle cx="26" cy="26" r="24" fill="var(--brand)"/><path d="M14 27l8 8 16-17" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="40" style="animation:draw .5s .4s forwards"/></svg><h1 style="margin:18px 0 6px">Booking confirmed</h1><p class="mut">${p.n} · ${SL[S.slot]}<br>Receipt #TW-${4820+S.bk.length}</p><button class="btn" style="margin-top:28px" data-a="track">Track arrival live</button><button class="btn sec" style="margin-top:10px" data-a="tab" data-t="bookings">View bookings</button></div></div>`},
fail:()=>`<div class="pg" style="min-height:760px;display:grid;place-items:center;text-align:center"><div><div class="eic" style="animation:pop .5s both;background:rgba(229,72,77,.14);color:var(--red)">${I('warn',40)}</div><h1 style="margin:14px 0 6px">Card was declined</h1><p class="mut">Your bank refused the payment. Check the card details or use another method.</p><button class="btn" style="margin:24px 0 10px" data-a="checkout">Try again</button><button class="btn sec" data-a="tab" data-t="home">Cancel</button></div></div>`,
bookings:()=>`<div class="pg"><h2 style="font-size:28px">Bookings</h2><div style="margin-top:16px;display:grid;gap:12px">${S.bk.length?S.bk.map((b,i)=>`<div class="card row rise" style="--i:${i};padding:14px"><div style="width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none">${b.i}</div><div style="flex:1"><b>${b.n}</b><div class="mut">${b.w}</div></div><b>$${b.t}</b></div>`).join(''):`<div style="text-align:center;padding:50px 10px"><div class="eic">${I('cal',36)}</div><h3 style="margin:10px 0 6px">No bookings yet</h3><p class="mut" style="margin-bottom:18px">Book a pro and it will show up here.</p><button class="btn" data-a="tab" data-t="explore">Find a pro</button></div>`}</div></div>`,
alerts:()=>`<div class="pg"><div class="row sp"><h2 style="font-size:28px">Alerts</h2><button class="chip" data-a="readall">Mark all read</button></div><div style="margin-top:16px;display:grid;gap:10px">${S.n.map((n,i)=>`<div class="card pr row rise" data-a="read" data-i="${i}" style="--i:${i};padding:14px;${n.u?'border-left:4px solid var(--brand)':''}"><div class="av" style="background:linear-gradient(135deg,var(--brand),var(--brand2))">${n.a}</div><div style="flex:1"><div class="row sp"><b>${n.t}</b><span class="mut">${n.w}</span></div><div class="mut">${n.m}</div><span class="tag" style="display:inline-block;margin-top:6px">${n.k==='Live'?'● Live':n.k}</span></div></div>`).join('')}</div></div>`,
profile:()=>`<div class="pg"><div class="row rise"><div class="av" style="width:68px;height:68px;font-size:26px">N</div><div><h2>Nicholas</h2><div class="mut">nicholas@example.com</div></div></div><div class="card rise" style="--i:1;margin-top:22px;padding:6px 16px">${[['Push notifications','np'],['Share my location','nl'],['Dark mode','dark']].map(t=>`<div class="row sp" style="padding:12px 0;border-bottom:1px solid var(--line)"><span>${t[0]}</span><button class="tog ${S[t[1]]?'on':''}" data-a="tog" data-k="${t[1]}" aria-label="${t[0]}"></button></div>`).join('')}${['Payment methods','Privacy','Help and support','About Tidewell 1.0'].map(x=>`<div class="row sp pr" data-a="toast" data-m="${x} (mock screen)" style="padding:14px 0;border-bottom:1px solid var(--line)"><span>${x}</span><span class="mut">›</span></div>`).join('')}</div><button class="btn sec" style="margin-top:20px;color:var(--red)" data-a="logout">Log out</button></div>`};
function render(){scr.innerHTML=V[S.scr]();scr.scrollTop=0;const m=main.includes(S.scr);$('#tabs').innerHTML=m?`<nav class="tabs">${[['home','home','Home'],['explore','explore','Explore'],['bookings','cal','Bookings'],['alerts','bell','Alerts'],['profile','user','Profile']].map(t=>`<button class="tab ${S.scr==t[0]?'on':''}" data-a="tab" data-t="${t[0]}"><span>${I(t[1],24)}</span>${t[2]}${t[0]=='alerts'&&S.n.some(n=>n.u)?'<i class="dot"></i>':''}</button>`).join('')}</nav>`:'';
scr.querySelectorAll('[data-n]').forEach(e=>{const t=+e.dataset.n,s=performance.now();(function f(n){const k=Math.min(1,(n-s)/900);e.textContent=Math.round(t*(1-Math.pow(1-k,3)));k<1&&requestAnimationFrame(f)})(s)});
const lv=$('#lv');if(lv)setTimeout(()=>lv.style.height=lv.dataset.h+'%',80);
const rt=$('#rt');if(rt){const L=rt.getTotalLength(),t0=performance.now(),mv=$('#mv'),et=$('#eta'),bar=$('#bar');(function f(n){if(S.scr!='track')return;const k=Math.min(1,(n-t0)/14000),pt=rt.getPointAtLength(L*k);mv.style.left=pt.x+'%';mv.style.top=pt.y+'%';et.textContent=Math.ceil(12*(1-k));bar.style.width=k*100+'%';k<1?requestAnimationFrame(f):toast('Your pro has arrived')})(t0)}
const q=$('#q');if(q)q.oninput=e=>{S.q=e.target.value;$('#res').innerHTML=results()};
const pw=$('#pw');if(pw)pw.oninput=e=>{const v=e.target.value;let s=(v.length>=8)+(/[A-Z]/.test(v))+(/\d/.test(v))+(/[^\w]/.test(v));$('#st').style.width=v?s*25+'%':0;$('#st').style.background=['var(--red)','var(--red)','var(--sun)','var(--brand)','var(--brand)'][s];$('#sl').textContent=v?['Weak','Weak','Okay','Strong','Very strong'][s]:'Password strength'}}
function sheet(on){$('#sb').innerHTML=`<h3 style="margin-bottom:14px">Sort by</h3>${[['rating','Top rated'],['price','Lowest price'],['distance','Nearest']].map(o=>`<div class="row sp pr" data-a="sort" data-s="${o[0]}" style="padding:14px 0;border-bottom:1px solid var(--line)"><span>${o[1]}</span><span>${S.sort==o[0]?I('check',22,'var(--brand2)'):''}</span></div>`).join('')}`;$('#sheet').classList.toggle('show',on)}
function load(){S.ld=1;const r=$('#res');if(r)r.innerHTML=results();setTimeout(()=>{S.ld=0;const r=$('#res');if(r)r.innerHTML=results()},550)}
document.addEventListener('click',e=>{
if(e.target.id=='sheet'){sheet(0);return}
const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,d=t.dataset;e.stopPropagation();
if(a!='fav')buzz();
({skip:()=>go('login'),next:()=>S.ob<2?go('ob',{ob:S.ob+1}):go('login'),pw:()=>{S.email=$('#em').value;S.pass=$('#pw').value;go('login',{pw:!S.pw})},
demo:()=>go('home',{tab:'home'}),
login:()=>{const em=$('#em').value,pw=$('#pw').value;S.email=em;S.pass=pw;let ok=1;$('#em').classList.remove('bad');$('#pw').classList.remove('bad');$('#ee').textContent=$('#pe').textContent='';
if(!/^\S+@\S+\.\S+$/.test(em)){ok=0;$('#em').classList.add('bad');$('#ee').textContent='Enter a valid email address.'}
if(pw.length<8){ok=0;$('#pw').classList.add('bad');$('#pe').textContent='Use at least 8 characters.'}
if(!ok)return;S.busy=1;render();setTimeout(()=>{S.busy=0;go('home');toast('Welcome back, Nicholas')},1100)},
tab:()=>{S.tab=d.t;go(d.t,d.t=='explore'?{}:{});if(d.t=='explore')load()},
cat:()=>{S.cat=d.c;S.q='';S.view='list';go('explore');load()},
view:()=>{S.view=d.v;go('explore')},clear:()=>{S.cat='All';S.q='';go('explore')},
mp:()=>{S.mp=+d.id;$('#res').innerHTML=results()},
open:()=>go('detail',{sel:+d.id}),back:()=>go(S.scr=='detail'?S.tab:'detail'),
fav:()=>{const i=+d.id;S.fav.has(i)?S.fav.delete(i):S.fav.add(i);toast(S.fav.has(i)?'Saved to favorites':'Removed from favorites');render()},
slot:()=>go('detail',{slot:+d.i}),checkout:()=>go('checkout'),pay:()=>go('checkout',{pay:d.m}),
promo:()=>{if($('#pc').value.trim().toUpperCase()=='HELLO10'){S.promo=.1;go('checkout');toast('Promo applied: 10% off')}else toast('That code is not valid')},
paynow:()=>{go('proc');setTimeout(()=>{const p=P.find(x=>x.id==S.sel);S.bk.unshift({n:p.n,e:p.e,i:ill(p),w:SL[S.slot],t:price().tot});S.n.unshift({t:'Booking confirmed',m:p.n+' · '+SL[S.slot],a:'✓',w:'Now',u:1,k:'Bookings'});go('ok')},1800)},
decline:()=>{go('proc');setTimeout(()=>go('fail'),1500)},
sheet:()=>sheet(1),sort:()=>{S.sort=d.s;sheet(0);go('explore')},
readall:()=>{S.n.forEach(n=>n.u=0);go('alerts');toast('All caught up')},read:()=>{S.n[+d.i].u=0;go('alerts')},
tog:()=>{S[d.k]=!S[d.k];if(d.k=='dark')document.documentElement.dataset.theme=S.dark?'dark':'light';go('profile')},
toast:()=>toast(d.m),track:()=>go('track'),logout:()=>{sheet(0);$('#sb').innerHTML='<h3>Log out?</h3><p class="mut" style="margin:8px 0 18px">You can sign back in anytime.</p><button class="btn dng" data-a="out">Log out</button><button class="btn sec" style="margin-top:10px" data-a="stay">Stay signed in</button>';$('#sheet').classList.add('show')},
out:()=>{$('#sheet').classList.remove('show');go('login',{pass:''})},stay:()=>$('#sheet').classList.remove('show')})[a]()});
render();setTimeout(()=>{if(S.scr=='splash')go('ob')},2200);
</script></body></html>
